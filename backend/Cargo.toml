[package]
name = "cyber_blog_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Authentication
jsonwebtoken = "8.3"
argon2 = "0.5.0"  # For password hashing

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
dotenv = "0.15"
env_logger = "0.10.0"
rand = "0.8"
slug = "0.1.4"  # For URL slugs