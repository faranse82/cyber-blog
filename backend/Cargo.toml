[package]
name = "cyber_blog_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = { version = "4", features = ["rustls-0_21"] }
actix-cors = "0.7"
actix-governor = "0.4"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Authentication & Security
jsonwebtoken = "8.3"
argon2 = "0.5.0"
validator = { version = "0.16", features = ["derive"] }
html-escape = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
dotenv = "0.15"
env_logger = "0.10.0"
rand = "0.8"
slug = "0.1.4"
tokio = { version = "1", features = ["full"] }

# TLS - Use compatible versions
rustls = "0.21"
rustls-pemfile = "1.0"
log = "0.4.27"
ammonia = "3"
actix-multipart = "0.7.2"
futures-util = "0.3.31"
maplit = "1.0"
reqwest = "0.12.19"
